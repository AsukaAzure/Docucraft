name: Unsigned APK Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag for the release'
        required: false
        default: ''
      release_name:
        description: 'Release name'
        required: false
        default: ''
      body:
        description: 'Release notes'
        required: false
        default: ''

permissions:
  contents: write
  actions: write

jobs:
  build_and_release_unsigned_apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up build environment
        uses: ./.github/actions/setup-build
        with:
          cache-read-only: 'true'
          firebase-placeholder: 'true'

      - name: Build unsigned release APK
        run: ./gradlew :app:assembleRelease

      - name: Verify APK is generated
        run: |
          echo "Generated APK files:"
          find app/build/outputs/apk -name "*.apk" -print
          test "$(find app/build/outputs/apk -name "*.apk" | wc -l)" -gt 0

      - name: Create GitHub release and upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name || format('v{0}', github.run_number) }}
          name: ${{ github.event.inputs.release_name || github.event.inputs.tag || github.ref_name || format('Release {0}', github.run_number) }}
          body: ${{ github.event.inputs.body || 'Unsigned APK build' }}
          files: app/build/outputs/apk/**/*.apk
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
